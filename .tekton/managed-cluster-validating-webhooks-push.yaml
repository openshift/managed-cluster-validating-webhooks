apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/openshift/managed-cluster-validating-webhooks?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "push" && target_branch == "master"
  labels:
    appstudio.openshift.io/application: managed-cluster-validating-webhooks
    appstudio.openshift.io/component: managed-cluster-validating-webhooks
    pipelines.appstudio.openshift.io/type: build
  name: managed-cluster-validating-webhooks-on-push
  namespace: managed-cluster-validating-webhooks-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads/managed-cluster-validating-webhooks-tenant/openshift/managed-cluster-validating-webhooks:{{revision}}
  - name: dockerfile
    value: build/Dockerfile
  - name: path-context
    value: .
  - name: build-args
    value:
    - BASE_IMAGE=brew.registry.redhat.io/rh-osbs/openshift-golang-builder:rhel_9_1.26
  taskRunTemplate:
    serviceAccountName: build-pipeline-managed-cluster-validating-webhooks
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
  # Use boilerplate master so task digests stay in Conforma acceptable-bundles
  # (stale inlined pipelineSpec was failing Enterprise Contract with 6+ trusted_task violations).
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/openshift/boilerplate
    - name: revision
      value: master
    - name: pathInRepo
      value: pipelines/docker-build-oci-ta/pipeline.yaml
status: {}
